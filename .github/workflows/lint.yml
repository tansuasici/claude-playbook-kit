name: Lint & Link Check

# No pull_request trigger: this runs on a self-hosted runner on a prod server
# while GitHub-hosted runners are unavailable, and this repo is public. For a
# PR, run it by hand on the branch: gh workflow run lint.yml --ref <branch>
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: [self-hosted, claudeplaybookkit]
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
          config: ".markdownlint.json"

  link-check:
    name: Check Links
    runs-on: [self-hosted, claudeplaybookkit]
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept "200..=299,429,503"
            --exclude-path CHANGELOG.md
            --exclude "example.com"
            --exclude "localhost"
            --exclude "wiki.internal"
            --exclude "docs.api.com"
            --exclude "grafana.internal"
            --exclude "external-api"
            --exclude "api.example.com"
            "**/*.md"
          fail: true
